<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đấu Trường Sinh Tồn - Khung hình game</title>
<style>
:root{--bg:#0b0b16;--fg:#f2f2ff;--card:#171730;--bd:#33336a;--ac:#ff2d75;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b16;--fg:#f2f2ff;--card:#171730;--bd:#33336a}}
:root[data-theme="dark"]{--bg:#0b0b16;--fg:#f2f2ff;--card:#171730;--bd:#33336a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:6px}
body.st{padding:0;background:#000;height:100dvh;justify-content:center}body.st #pn{display:none}
canvas{display:block;border-radius:12px;background:#10102a;touch-action:manipulation}body.st canvas{border-radius:0}
#pn{width:100%;max-width:560px;margin-top:6px}
.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
button,input{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
button{cursor:pointer;flex:1;min-width:70px}button:active{background:var(--ac)}
input{flex:2;min-width:100px}
.g{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25;min-width:96px;padding:6px 4px}.g span{font-size:20px}.g b{font-size:13px}.g small{font-size:10.5px;opacity:.75;text-align:center}
.hint{font-size:11px;opacity:.7;margin:6px 2px}
body{padding:0;background:#000;height:100dvh;justify-content:center;overflow:hidden}canvas{border-radius:0}
</style>
</head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');

/* ĐÃ THU GỌN KHUNG XANH Ở ĐÂY (X0, X1, Y0, Y1) ĐỂ TRÁNH TRÀN VIỀN */
const W=540,H=960,X0=50,X1=W-50,Y0=200,Y1=H-220;
const MAXP=12;
const NAMES=['Minh','Lan','Hùng','Mai','Tuấn','Hà','Bống','Kiên','Linh','Nam','Thảo','Đạt','Vy','Sơn','Quân','Nga','Phúc','Trang'];
const VIEW=['Ngọc','Khoa','Yến','Bảo','Thu','Long','Hạnh','Dũng'];
const SK={rose:['🌹','Hồi máu','hoa hồng'],saw:['🪚','Cưa máy','cưa máy'],rocket:['🚀','Tăng tốc','tên lửa'],bomb:['💣','Bom','bom'],magnet:['🧲','Nam châm','nam châm']};
const KINDS=['cat','penguin','dino','bear'],GK=Object.keys(SK);
const STARS=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,s:.6+Math.random()*1.4,p:Math.random()*6}));
let RK=[],round=0,overT=0,bn=null,spoke2=false;const OVER_MS=8000;
let P=[],F=[],FX=[],LOG=[],SPK=[],REALS=[],NEXT=[],lastFull=0,t=0,over=null,sel=null,T=0,gt=4,vo=false,Q=[],speaking=false,curReal=false;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],rad=p=>Math.sqrt(p.m)*2.6;
const pt=()=>[rnd(X0+20,X1-20),rnd(Y0+20,Y1-20)];

/* ---- nhạc nền + hiệu ứng skill (WebAudio, không cần file) ---- */
let AC=null,mg,sg,music=false,mt=0,ms=0,mtimer=null,NB=null,lastEat=0;
const SD=60/124/4,CH=[[110,[0,3,7,12]],[87.31,[0,4,7,12]],[130.81,[0,4,7,12]],[98,[0,4,7,12]]];
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);sg=AC.createGain();sg.gain.value=.8;sg.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type,v,dest,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||sg);o.start(t);o.stop(t+d+.03)}
function noise(t,d,v,type,f,f2,dest){const n=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();n.buffer=NB;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(fl);fl.connect(g);g.connect(dest||sg);n.start(t);n.stop(t+d+.03)}
function sched(){if(!music||!AC)return;
  while(mt<AC.currentTime+.25){const s=ms%16,[r,ch]=CH[Math.floor(ms/16)%4],t=mt;
    if(s%4===0)tone(150,t,.2,'sine',.7,mg,45);
    if(s%4===2)noise(t,.05,.1,'highpass',7000,0,mg);
    if(s===4||s===12)noise(t,.13,.18,'bandpass',1800,0,mg);
    if(s%2===0)tone(r,t,SD*1.8,'triangle',.4,mg);
    tone(r*4*Math.pow(2,ch[[0,1,2,3,2,1,2,3][s%8]]/12),t,SD*.9,'square',.045,mg);
    if(s===0)for(const n of ch.slice(0,3))tone(r*2*Math.pow(2,n/12),t,SD*15,'triangle',.05,mg);
    if(s%16===8&&Math.floor(ms/16)%2===1)tone(r*8*Math.pow(2,ch[2]/12),t,SD*3,'sine',.06,mg);
    mt+=SD;ms++}}
function setMusic(on){music=on;
  if(on){ac();mt=AC.currentTime+.1;ms=0;if(!mtimer)mtimer=setInterval(sched,60)}try{pushState()}catch(e){}}
function duck(on){if(AC)mg.gain.setTargetAtTime(on?.18:.5,AC.currentTime,.1)}
function sfx(k){const free=k==='win'||k==='clap'||k==='boom';if(!AC||(!music&&!free))return;const t=AC.currentTime+.02;
  if(k==='rose')[660,880,1100,1320,1760].forEach((f,i)=>tone(f,t+i*.07,.35,'sine',.28));
  if(k==='saw'){tone(110,t,.7,'sawtooth',.28,sg,330);tone(165,t,.7,'square',.1,sg,440);for(let i=0;i<6;i++)noise(t+i*.1,.08,.25,'highpass',3000,0)}
  if(k==='sawhit'){tone(260,t,.12,'sawtooth',.14,sg,180);noise(t,.1,.2,'highpass',4000,0)}
  if(k==='rocket'){noise(t,.8,.35,'bandpass',300,3500);tone(180,t,.8,'sawtooth',.18,sg,1400)}
  if(k==='bomb'){tone(160,t,.8,'sine',.9,sg,30);noise(t,.6,.6,'lowpass',2500,80)}
  if(k==='magnet')for(let i=0;i<5;i++)tone(i%2?420:300,t+i*.11,.14,'square',.1,sg,i%2?300:420);
  if(k==='eat'){if(AC.currentTime-lastEat<.12)return;lastEat=AC.currentTime;tone(420,t,.1,'sine',.3,sg,900)}
  if(k==='join')[523,659,784].forEach((f,i)=>tone(f,t+i*.09,.25,'triangle',.3));
  if(k==='clap')for(let i=0;i<90;i++)noise(t+Math.pow(Math.random(),.8)*4,.05+Math.random()*.04,.1+Math.random()*.15,'bandpass',1200+Math.random()*2800,0);
  if(k==='boom'){tone(130,t,.4,'sine',.4,sg,40);noise(t,.3,.25,'lowpass',2200,200)}
  if(k==='win')[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.13,.4,'triangle',.32))}

/* ---- GIỌNG ĐỌC ĐÃ FIX CHUẨN TIẾNG VIỆT ---- */
function speak(s,real){
  if(!vo||!window.speechSynthesis)return;
  if(!real&&(Q.length>1||curReal))return;
  if(real){let i=Q.findIndex(x=>!x.real);if(i<0)i=Q.length;Q.splice(i,0,{s,real})}else Q.push({s,real});
  nextVoice();
}
function nextVoice(){
  if(speaking||!Q.length)return;
  const it=Q.shift();speaking=true;curReal=it.real;duck(true);
  
  const u=new SpeechSynthesisUtterance(it.s);
  u.lang='vi-VN';
  u.rate=1.05;

  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(voice => voice.lang === 'vi-VN' || voice.lang === 'vi' || voice.name.toLowerCase().includes('vietnamese') || voice.name.toLowerCase().includes('vietnam'));
  if(v) {
    u.voice = v;
  }

  u.onend=u.onerror=()=>{speaking=false;curReal=false;if(!Q.length)duck(false);nextVoice()};
  window.speechSynthesis.speak(u);
}

function say(s){LOG.push({s,t:5});if(LOG.length>5)LOG.shift()}
function burst(x,y,n=46){const h=rnd(0,360);for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(40,190);SPK.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+rnd(-30,30),d:.8,s:2.4})}}
/* ---- game ---- */
function spawn(name,real){const[x,y]=pt();const p={x,y,vx:0,vy:0,m:real?28:20,name,real,hue:rnd(0,360),sh:real?4:0,saw:0,cd:0,dash:0,mg:0,alive:true,pop:[]};P.push(p);return p}
function reset(){
  t=0;over=null;sel=null;P=[];FX=[];F=[];RK=[];overT=0;spoke2=false;round++;
  bn={s:'VÒNG ĐẤU BẮT ĐẦU',n:'Vòng '+round,t:2.8};speak('Vòng đấu bắt đầu',true);
  REALS=NEXT.slice(0,MAXP);NEXT=[];
  REALS.forEach(n=>spawn(n,true));
  const nb=Math.max(3,14-REALS.length*2);
  NAMES.slice().sort(()=>Math.random()-.5).slice(0,nb).forEach(n=>spawn(n,false));
  for(let i=0;i<140;i++){const[x,y]=pt();F.push({x,y})}
}
function join(name){
  name=String(name).slice(0,12);
  if(over){if(NEXT.includes(name)||NEXT.length>=MAXP)return;
    NEXT.push(name);say('⭐ '+name+' vào ván sau!');speak('Chào mừng '+name+' vào đấu trường',true);sfx('join');return}
  if(REALS.includes(name)){if(!P.some(p=>p.alive&&p.real&&p.name===name))spawn(name,true);return}
  if(REALS.length>=MAXP){if(t-lastFull>3||t<lastFull){lastFull=t;say('🚫 Sân đã đầy '+MAXP+' người!')}return}
  REALS.push(name);spawn(name,true);
  const bots=P.filter(p=>p.alive&&!p.real).sort((a,b)=>a.m-b.m);
  if(bots.length>5)bots[0].alive=false;
  say('⭐ '+name+' vào sân!');speak('Chào mừng '+name+' vào đấu trường',true);sfx('join');
}
function comment(name,text){if(String(text).normalize('NFC').trim().toLowerCase()==='đấu')join(name)}
function gift(type,from,real,tg){
  const al=P.filter(p=>p.alive);if(!al.length||over)return;
  const rp=al.filter(p=>p.real),pool=(rp.length&&Math.random()<.7)?rp:al;
  const p=tg&&tg.alive?tg:pick(pool),[ic,sk,vn]=SK[type];
  if(type==='rose')p.m+=16;
  if(type==='saw'){p.saw=8;burst(p.x,p.y,26)}
  if(type==='rocket'){p.dash=2.5;p.m+=4}
  if(type==='magnet')p.mg=6;
  if(type==='bomb'){FX.push({x:p.x,y:p.y,r:10,a:1});burst(p.x,p.y,30);
    for(const q of al){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d<170&&!q.sh){q.vx+=dx/d*300;q.vy+=dy/d*300;q.m*=.82}}}
  sfx(type);
  p.pop.push({s:'+'+sk+' '+ic,sub:from,t:2.8});
  say(ic+' '+from+' → '+p.name);
  speak(from+' tặng '+vn+(vn.toLowerCase()===sk.toLowerCase()?'':', '+sk.toLowerCase()),real);
}
function step(dt){
  t+=dt;gt-=dt;
  if(gt<=0){gt=rnd(5,9);gift(pick(GK),pick(VIEW),false)}
  const al=P.filter(p=>p.alive);
  for(const p of al){
    p.sh=Math.max(0,p.sh-dt);p.saw=Math.max(0,p.saw-dt);p.cd=Math.max(0,p.cd-dt);p.dash=Math.max(0,p.dash-dt);p.mg=Math.max(0,p.mg-dt);
    p.pop.forEach(o=>o.t-=dt);p.pop=p.pop.filter(o=>o.t>0);
    let tx=null,ty=null,best=1e9,fx=0,fy=0;
    for(const f of F){const d=Math.hypot(f.x-p.x,f.y-p.y);if(d<best){best=d;tx=f.x;ty=f.y}}
    for(const q of al){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;
      if(p.saw>0&&q.m>p.m){if(d<420&&d<best+160){best=d;tx=q.x;ty=q.y}}
      else if(q.m>p.m*1.15&&d<rad(q)+170){fx-=dx/d*1.6;fy-=dy/d*1.6}
      else if(p.m>q.m*1.15&&d<260&&d<best+60){best=d;tx=q.x;ty=q.y}}
    if(p.dash>0){let b=1e9;for(const q of al)if(q!==p&&q.m<p.m){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<b){b=d;tx=q.x;ty=q.y}}}
    if(p.x<X0+30)fx+=1;if(p.x>X1-30)fx-=1;if(p.y<Y0+30)fy+=1;if(p.y>Y1-30)fy-=1;
    const dx=(tx??p.x)-p.x,dy=(ty??p.y)-p.y,d=Math.hypot(dx,dy)||1;
    const sp=130/Math.pow(1+p.m/90,.45)*(p.dash>0?2.4:1),k=Math.min(1,dt*3);
    p.vx+=(dx/d*sp+fx*sp-p.vx)*k;p.vy+=(dy/d*sp+fy*sp-p.vy)*k;
    p.x=Math.max(X0,Math.min(X1,p.x+p.vx*dt));p.y=Math.max(Y0,Math.min(Y1,p.y+p.vy*dt));
    p.m-=dt*p.m*.004;
    for(const f of F){const dd=Math.hypot(f.x-p.x,f.y-p.y);
      if(p.mg>0&&dd<170&&dd>1){f.x+=(p.x-f.x)/dd*260*dt;f.y+=(p.y-f.y)/dd*260*dt}
      if(dd<rad(p)+3){p.m+=1.3;const[nx,ny]=pt();f.x=nx;f.y=ny}}
  }
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){
    let a=al[i],b=al[j];if(!a.alive||!b.alive)continue;if(a.m<b.m)[a,b]=[b,a];
    if(Math.hypot(a.x-b.x,a.y-b.y)<rad(a)-rad(b)*.4&&a.m>b.m*1.15&&!b.sh){
      a.m+=b.m*.8;b.alive=false;a.pop.push({s:'😋 ăn '+b.name,sub:'',t:1.8});sfx('eat');burst(b.x,b.y,24);say('💥 '+a.name+' ăn '+b.name);if(sel===b)sel=null}
  }
  for(const p of al){if(!p.alive||p.saw<=0)continue;
    for(const q of al){if(q===p||!q.alive||q.m<=p.m)continue;
      const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d<rad(p)+rad(q)+24){
        const loss=Math.min(q.m-p.m,q.m*.28*dt);q.m-=loss;q.vx+=dx/d*40;q.vy+=dy/d*40;
        q.hurt=(q.hurt||0)+loss;
        const mx=p.x+dx/d*(rad(p)+14),my=p.y+dy/d*(rad(p)+14);
        for(let i=0;i<3;i++)SPK.push({x:mx,y:my,vx:rnd(-90,90),vy:rnd(-110,20),l:1,h:rnd(25,55),d:3,s:2});
        if(p.cd<=0){p.cd=.7;sfx('sawhit');q.pop.push({s:'🪚 -'+Math.max(1,Math.round(q.hurt)),sub:'cưa của '+p.name,t:1.2});q.hurt=0;
          if(Math.random()<.15)say('🪚 '+p.name+' cưa '+q.name)}
      }
    }}
  for(const p of al)if(p.alive&&p.m<6)p.alive=false;
  for(const f of FX){f.r+=dt*260;f.a-=dt*1.8}FX=FX.filter(f=>f.a>0);
  for(const l of LOG)l.t-=dt;LOG=LOG.filter(l=>l.t>0);
  const left=P.filter(p=>p.alive);
  if((left.length<=1||t>=ROUND)&&!over){
    const w=left.sort((a,b)=>b.m-a.m)[0];over=w?w.name:'Không ai';
    overT=0;spoke2=false;speak(w?'Hoan hô! '+over+' chiến thắng':'Hết giờ, không ai thắng',true);sfx('win');sfx('clap');setTimeout(reset,OVER_MS)}
}
/* ---- vẽ ---- */
function ell(x,y,a,b,c){ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,6.283);ctx.fillStyle=c;ctx.fill()}
function tri(a,b,c,d,e,f,col){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fillStyle=col;ctx.fill()}
function animal(p,r){
  const k=p.k||(p.k=pick(KINDS)),f=p.vx>=0?1:-1,bo=1+Math.sin(T*7+p.hue)*.045;
  const col={cat:`hsl(${p.hue},85%,68%)`,penguin:'#33437a',dino:`hsl(${110+p.hue%50},65%,58%)`,bear:'#b5804a'}[k];
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(r*bo,r/bo);ctx.lineWidth=.06;ctx.strokeStyle='rgba(30,10,50,.6)';
  if(k==='cat'){tri(-.85,-.35,-.6,-1.1,-.15,-.8,col);tri(.85,-.35,.6,-1.1,.15,-.8,col);tri(-.7,-.55,-.58,-.9,-.35,-.75,'#ffb3c8');tri(.7,-.55,.58,-.9,.35,-.75,'#ffb3c8')}
  if(k==='bear'){ell(-.7,-.7,.32,.32,col);ell(.7,-.7,.32,.32,col);ell(-.7,-.7,.17,.17,'#f1d3a2');ell(.7,-.7,.17,.17,'#f1d3a2')}
  if(k==='dino'){for(let i=-1;i<=1;i++){const o=Math.abs(i)*.15;tri(i*.4-.18,-.85+o,i*.4,-1.3+o*1.3,i*.4+.18,-.85+o,'#ff9e3d')}}
  ctx.shadowColor=`hsl(${p.hue},100%,70%)`;ctx.shadowBlur=18;ell(0,0,1,1,col);ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(0,0,1,0,6.283);ctx.stroke();
  if(k==='penguin'){ell(0,.25,.66,.72,'#fff');ell(-1,.1,.18,.45,col);ell(1,.1,.18,.45,col);ell(-.35,1,.3,.12,'#ff9a2e');ell(.35,1,.3,.12,'#ff9a2e')}
  if(k==='dino'){ell(f*.25,.35,.6,.42,'rgba(255,255,200,.55)');ell(-.55,.25,.12,.1,'rgba(0,0,0,.14)')}
  if(k==='bear'){ell(0,.32,.42,.32,'#f1d3a2');ell(0,.2,.13,.08,'#3b2416')}
  if(k==='cat')tri(-.08,.12,.08,.12,0,.22,'#ff7aa0');
  ell(-.4,-.6,.28,.14,'rgba(255,255,255,.4)');
  const bl=Math.sin(T*1.7+p.hue*5)>.985;
  for(const x of[-.36,.36]){if(bl){ctx.beginPath();ctx.moveTo(x-.15,-.18);ctx.lineTo(x+.15,-.18);ctx.stroke()}
    else{ell(x,-.18,.2,.24,'#fff');ell(x+f*.06,-.15,.11,.14,'#222');ell(x+f*.06-.03,-.2,.04,.04,'#fff')}}
  if(k==='penguin')tri(-.17,0,.17,0,0,.26,'#ff9a2e');
  else{ctx.beginPath();ctx.arc(0,k==='cat'?.34:.48,.13,.2,Math.PI-.2);ctx.stroke()}
  if(k==='cat'){ctx.lineWidth=.03;for(const s of[-1,1])for(const y of[.2,.3]){ctx.beginPath();ctx.moveTo(s*.2,y);ctx.lineTo(s*.8,y+(y-.25)*1.2);ctx.stroke()}}
  ctx.restore();
}
function led(x,y,h,on){ctx.fillStyle=`hsla(${h},100%,60%,${on})`;ctx.shadowColor=`hsl(${h},100%,60%)`;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,3.5,0,6.283);ctx.fill()}
function draw(){
  const now=performance.now(),dt=Math.min(.05,(now-(draw.l||now))/1000);draw.l=now;T+=dt;
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a0f3d');bg.addColorStop(1,'#3a1048');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of STARS){ctx.globalAlpha=.3+.7*Math.abs(Math.sin(T*2+s.p));ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;

  }
  ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.65)';

    const y=p.y-rad(p)-22-(2.8-o.t)*20;ctx.globalAlpha=Math.min(1,o.t*1.5);

  if(over){
    if(Math.random()<dt*2.6)RK.push({x:rnd(70,470),y:H-20,ty:rnd(150,430),h:rnd(0,360)});
    for(const r of RK){r.y-=620*dt;SPK.push({x:r.x+rnd(-2,2),y:r.y,vx:rnd(-12,12),vy:rnd(20,60),l:1,h:40,d:3.5,g:0,s:2});
      if(r.y<=r.ty){r.dead=1;sfx('boom');
        for(let i=0;i<70;i++){const a=i/70*6.283,sp=rnd(120,190);SPK.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,h:r.h,d:.55,s:2.8})}
        for(let i=0;i<40;i++){const a=rnd(0,6.283),sp=rnd(30,110);SPK.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,h:r.h+rnd(60,140),d:.7,s:2.2})}}}
    RK=RK.filter(r=>!r.dead)}

  ctx.globalCompositeOperation='source-over';

  ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';
  ctx.font='bold 24px system-ui';ctx.fillStyle=`hsl(${(T*80)%360},100%,72%)`;ctx.strokeText('ĐẤU TRƯỜNG SINH TỒN',W/2,38);ctx.fillText('ĐẤU TRƯỜNG SINH TỒN',W/2,38);
  ctx.font='bold 15px system-ui';ctx.fillStyle='#fff';ctx.lineWidth=3;

  ctx.font='13px system-ui';ctx.fillStyle='#cfe';
  ctx.fillText('⏱ '+Math.max(0,Math.ceil(ROUND-t))+'s  ·  Còn '+al.length+'  ·  ⭐ '+ra,W/2,88);
  ctx.fillStyle='#ffd95a';ctx.fillText(tp,W/2,108);

  if(over){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-110,W,220);

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(bn){bn.t-=dt;if(bn.t<=0)bn=null}
  if(!over)step(dt);else{overT+=dt;if(!spoke2&&overT>3.2){spoke2=true;speak('Vòng đấu tiếp theo sẽ bắt đầu',true)}for(const f of FX){f.r+=dt*260;f.a-=dt*1.8}}draw();requestAnimationFrame(loop)}
/* ---- khung hình: tự vừa cửa sổ, KHÔNG có bảng điều khiển ---- */
const QS=new URLSearchParams(location.search);
function fit(){const h=Math.min(innerHeight,innerWidth*16/9);cv.style.height=h+'px';cv.style.width=h*9/16+'px'}

addEventListener('pointerdown',()=>{try{if(AC)AC.resume()}catch(e){}});

const GIFTMAP=[[/nước hoa|perfume|cưa/,'saw'],[/hoa hồng|rose/,'rose'],[/bắn tim|finger heart|heart|tên lửa|rocket/,'rocket'],[/heo|pig|bom|bomb/,'bomb'],[/bánh vòng|donut|doughnut|nam châm|magnet/,'magnet']];
const gmap=s=>{s=String(s).normalize('NFC').toLowerCase();for(const[r,k]of GIFTMAP)if(r.test(s))return k;return pick(GK)};
window.TikGame={comment,gift:(n,k)=>gift(gmap(k||''),n,true)};

  else if(d.t==='gift'){const k=SK[d.key]?d.key:gmap(d.type||'');const tg=d.target?P.find(p=>p.alive&&p.name===d.target):null;gift(k,String(d.name||'Khán giả').slice(0,14),true,tg||sel)}

/* TikFinity Desktop */
function tfConnect(){
  const host=QS.get('tf')||'127.0.0.1:21213';let ws;
  try{ws=new WebSocket('ws://'+host+'\/')}catch(e){tf='lỗi kết nối';setTimeout(tfConnect,4000);return}

  ws.onmessage=ev=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}
